name: CodeMender PR Delta Security Gate

# =============================================================================
# Caller Workflow for Pull Requests (Optional Synchronous SDLC Gate)
# =============================================================================
# Runs `cm find --diff` on every Pull Request targeting `main`, analyzing only
# modified hunks and 1-hop caller/callee dependencies in < 2 minutes.
# Blocks the PR only if NEW Critical/High vulnerabilities are introduced.
# =============================================================================

on:
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  pr-delta-gate:
    uses: Cotomacio/codemender-enterprise-workflows/.github/workflows/codemender-reusable.yml@main
    with:
      gcp_project_id: ${{ vars.GCP_QUOTA_PROJECT }}
      gcp_wif_provider: ${{ vars.GCP_WIF_PROVIDER }}
      gcp_sa_email: ${{ vars.GCP_SA_EMAIL }}
      gcp_telemetry_bucket: ${{ vars.GCP_TELEMETRY_BUCKET }}
      scan_mode: 'diff'
      enable_autofix: false
      fix_severities: 'CRITICAL,HIGH'
      enforce_gate: true
    secrets:
      wif_audience: ${{ secrets.WIF_AUDIENCE }}
